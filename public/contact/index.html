<style>
  :root {
    --bg: #000000;
    --accent: #f87171;
    --text: #fee2e2;
    --muted: rgba(254, 226, 226, 0.5);
    --bar: rgba(255, 255, 255, 0.04);
    --bar-line: rgba(239, 68, 68, 0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: "Be Vietnam Pro", system-ui, sans-serif; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    overflow-x: hidden; position: relative;
  }
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; pointer-events: none; filter: blur(80px);
  }
  body::before { width: 34rem; height: 34rem; top: -14rem; right: -10rem; background: rgba(220, 38, 38, 0.16); }
  body::after { width: 28rem; height: 28rem; bottom: -12rem; left: -10rem; background: rgba(234, 88, 12, 0.08); }

  /* Nền hạt ký tự trôi + vệt sáng rơi */
  #drift { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }

  /* Web: nội dung ở giữa, chữ CONTACT to sát đáy, bị cắt chân chữ */
  .content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 56px 16px 32px; position: relative; z-index: 1; }
  main { width: 100%; max-width: 30rem; }
  .wordmark { position: relative; z-index: 1; width: 100%; line-height: 0; }
  .wordmark canvas { display: block; cursor: crosshair; touch-action: pan-y; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sub { text-align: center; margin: 0 0 2.2rem; font-weight: 300; color: var(--muted); font-size: 0.95rem; letter-spacing: 0.04em; }

  .links { display: flex; flex-direction: column; gap: 0.9rem; list-style: none; }
  @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --ang: 360deg; } }

  /* Nút kính mờ (glassmorphism) + vệt sáng chạy quanh viền */
  .bar {
    position: relative; isolation: isolate;
    display: flex; align-items: center; gap: 1rem;
    padding: 0.7rem 0.7rem 0.7rem 0.7rem; border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
    border: 1px solid rgba(255, 255, 255, 0.08);
    -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -1px 0 rgba(0, 0, 0, 0.4), 0 10px 30px -14px rgba(220, 38, 38, 0.35);
    color: var(--text); text-decoration: none;
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
  }
  .bar:hover, .bar:focus-visible {
    transform: translateY(-2px); outline: none;
    border-color: rgba(248, 113, 113, 0.25);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -1px 0 rgba(0, 0, 0, 0.4), 0 0 42px -8px rgba(239, 68, 68, 0.55);
  }
  .bar::before, .bar::after { content: ""; position: absolute; border-radius: inherit; pointer-events: none; }
  /* vệt sáng xoay quanh viền */
  .bar::before {
    inset: -1px; padding: 1px;
    background: conic-gradient(from var(--ang), transparent 0 68%, rgba(239, 68, 68, 0.7) 78%, #fed7aa 84%, rgba(251, 146, 60, 0.8) 88%, transparent 96%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 4.5s linear infinite;
    opacity: 0.55; transition: opacity .3s ease;
  }
  .links li:nth-child(2) .bar::before { animation-delay: -1.1s; }
  .links li:nth-child(3) .bar::before { animation-delay: -2.2s; }
  .links li:nth-child(4) .bar::before { animation-delay: -3.3s; }
  .bar:hover::before { opacity: 1; animation-duration: 2.2s; }
  /* quầng đỏ bên trong đi theo con trỏ, đậm dần khi chuột lại gần */
  .bar::after {
    inset: 0; z-index: -1;
    background: radial-gradient(16rem circle at var(--mx, 50%) var(--my, 50%), rgba(239, 68, 68, 0.24), rgba(234, 88, 12, 0.08) 40%, transparent 65%);
    opacity: var(--o, 0); transition: opacity .25s ease;
  }

  .logo {
    width: 2.9rem; height: 2.9rem; flex: none; border-radius: 50%;
    display: grid; place-items: center; background: #fff;
  }
  .logo svg { width: 1.6rem; height: 1.6rem; display: block; }
  .name { flex: 1; font-weight: 500; font-size: 1.05rem; }
  .name small { display: block; font-weight: 300; font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
  .go {
    width: 2.4rem; height: 2.4rem; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: background .3s, border-color .3s;
  }
  .bar:hover .go { background: rgba(239, 68, 68, 0.18); border-color: rgba(248, 113, 113, 0.4); }
  .arrow { width: 1rem; height: 1rem; stroke: var(--muted); fill: none; stroke-width: 2; transition: stroke .25s, transform .25s; }
  .bar:hover .arrow { stroke: var(--accent); transform: translate(2px, -2px); }

  .nav-back { display: flex; justify-content: center; gap: 1.6rem; margin-top: 2.4rem; }
  .back { display: block; font-size: 0.85rem; color: var(--muted); text-decoration: none; letter-spacing: 0.06em; }
  .back:hover { color: var(--accent); }

  /* Mobile: CONTACT dọc sát trái, mỗi chữ một dòng; nút ở cột phải */
  @media (max-width: 767px) {
    body { flex-direction: row; }
    .wordmark { order: -1; width: auto; flex: none; position: sticky; top: 0; height: 100vh; height: 100svh; }
    .content { padding: 24px 12px 24px 6px; min-width: 0; }
    .sub { text-align: left; font-size: 0.8rem; margin-bottom: 1.4rem; }
    .links { gap: 0.7rem; }
    .bar { gap: 0.7rem; padding: 0.55rem; }
    .go { width: 2rem; height: 2rem; }
    .logo { width: 2.4rem; height: 2.4rem; }
    .logo svg { width: 1.35rem; height: 1.35rem; }
    .name { font-size: 0.95rem; min-width: 0; }
    .name small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-back { justify-content: flex-start; gap: 1.2rem; }
  }
  /* Hiệu ứng vào trang: nền mờ dần lên, dòng chữ + từng nút trượt lên lần lượt */
  @keyframes rise { from { opacity: 0; transform: translateY(28px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #drift { animation: fadeIn 1.6s ease backwards; }
  .sub, .links li, .nav-back { animation: rise .9s cubic-bezier(.2, .8, .2, 1) backwards; }
  .sub { animation-delay: .25s; }
  .links li:nth-child(1) { animation-delay: .4s; }
  .links li:nth-child(2) { animation-delay: .5s; }
  .links li:nth-child(3) { animation-delay: .6s; }
  .links li:nth-child(4) { animation-delay: .7s; }
  .nav-back { animation-delay: .9s; }
  /* rời trang (bấm Về portfolio / Về CV) */
  body > * { transition: opacity .45s ease, transform .45s ease, filter .45s ease; }
  body.leaving > * { opacity: 0; transform: translateY(-14px); filter: blur(6px); }

  @media (prefers-reduced-motion: reduce) {
    .bar::before { animation: none; }
    #drift, .sub, .links li, .nav-back { animation: none; }
  }
</style>

<div class="wordmark"><canvas id="halftone" aria-hidden="true"></canvas></div>
<script>
/* Chữ CONTACT dạng chấm halftone: chấm dạt ra theo con trỏ (lò xo), ấm màu khi chuyển động, bấm để tạo vòng sóng */
(async function () {
  const WORD = 'CONTACT';
  const canvas = document.getElementById('halftone');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { await document.fonts.load('800 100px "Be Vietnam Pro"'); } catch (e) {}

  let W, H, dpr, gap, dots = [], rings = [];
  const ptr = { x: -9999, y: -9999, on: false };

  const mobileMQ = matchMedia('(max-width: 767px)');
  let firstBuild = true;

  function build() {
    const mobile = mobileMQ.matches;
    dpr = Math.min(devicePixelRatio || 1, 2);
    const off = document.createElement('canvas');
    const o = off.getContext('2d');
    const font = fs => `800 ${fs}px "Be Vietnam Pro", sans-serif`;
    o.font = font(100);
    const m = o.measureText(WORD);
    const asc = m.actualBoundingBoxAscent / 100;            // chiều cao chữ hoa / cỡ chữ

    let lines;
    if (!mobile) {
      // 1 dòng, rộng hết màn hình, cắt ~22% phần chân chữ
      W = document.documentElement.clientWidth;
      const fs = 100 * (W * 1.0) / m.width;
      const capH = asc * fs;
      gap = Math.max(4, W / 210);
      H = Math.round(gap * 0.6 + capH * 0.78);
      lines = [{ text: WORD, fs, x: W / 2, y: gap * 0.6 + capH, align: 'center' }];
    } else {
      // từng chữ một dòng, sát trái, cao bằng màn hình
      H = canvas.parentElement.getBoundingClientRect().height || innerHeight;
      const rowH = H / WORD.length;
      const fs = (rowH * 0.9) / asc;
      o.font = font(fs);
      const maxW = Math.max(...[...WORD].map(c => o.measureText(c).width));
      gap = Math.max(3, rowH / 22);
      W = Math.ceil(maxW + gap * 1.5);
      lines = [...WORD].map((c, i) => ({ text: c, fs, x: gap * 0.5, y: rowH * i + rowH * 0.5 + asc * fs / 2, align: 'left' }));
    }

    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    off.width = Math.ceil(W); off.height = Math.ceil(H);
    o.fillStyle = '#fff'; o.textBaseline = 'alphabetic';
    for (const l of lines) { o.font = font(l.fs); o.textAlign = l.align; o.fillText(l.text, l.x, l.y); }
    const data = o.getImageData(0, 0, off.width, off.height).data;

    const scatter = firstBuild && !reduce; firstBuild = false;
    dots = [];
    for (let y = gap / 2; y < H; y += gap) {
      for (let x = gap / 2; x < W; x += gap) {
        const a = data[(Math.floor(y) * off.width + Math.floor(x)) * 4 + 3] / 255;
        if (a > 0.35) dots.push({ hx: x, hy: y,
          x: scatter ? x + (Math.random() - 0.5) * W * 0.7 : x, y: scatter ? y + (Math.random() - 0.3) * H * 1.6 : y, vx: 0, vy: 0, r: gap * 0.36 * (0.7 + a * 0.3), base: baseColor(y) });
      }
    }
  }

  function local(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  }
  canvas.addEventListener('pointermove', e => { const p = local(e); ptr.x = p.x; ptr.y = p.y; ptr.on = true; });
  canvas.addEventListener('pointerleave', () => { ptr.on = false; ptr.x = ptr.y = -9999; });
  canvas.addEventListener('pointerdown', e => { const p = local(e); rings.push({ x: p.x, y: p.y, r: 0 }); });

  // dải đỏ từ trên xuống như tên trong CV (red-300 → red-500 → red-800); chấm chuyển động sáng sang cam
  const g0 = [252, 165, 165], g1 = [239, 68, 68], g2 = [153, 27, 27], hot = [251, 146, 60];
  const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  function baseColor(y) {
    // web: dải theo chiều cao chữ; mobile: dải theo từng dòng chữ
    const rowH = mobileMQ.matches ? H / WORD.length : H / 0.78;
    const k = Math.min(1, (y % rowH) / rowH);
    return k < 0.5 ? mix(g0, g1, k * 2) : mix(g1, g2, (k - 0.5) * 2);
  }
  function color(d, t) {
    const c = mix(d.base, hot, t);
    return `rgb(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])})`;
  }

  function frame() {
    const S = Math.max(W, H), R = Math.max(50, S * 0.09), R2 = R * R;
    rings.forEach(r => r.r += S * 0.012);
    rings = rings.filter(r => r.r < S * 1.2);

    ctx.clearRect(0, 0, W, H);
    for (const d of dots) {
      // lực đẩy từ con trỏ
      const dx = d.x - ptr.x, dy = d.y - ptr.y, q = dx * dx + dy * dy;
      if (q < R2 && q > 0.01) {
        const dist = Math.sqrt(q), f = (1 - dist / R) ** 2 * 3.2;
        d.vx += (dx / dist) * f; d.vy += (dy / dist) * f;
      }
      // vòng sóng khi bấm
      for (const r of rings) {
        const ex = d.hx - r.x, ey = d.hy - r.y, dist = Math.hypot(ex, ey) || 1, band = Math.abs(dist - r.r);
        if (band < gap * 2.2) { const f = (1 - band / (gap * 2.2)) * 2.4 * (1 - r.r / (S * 1.2)); d.vx += ex / dist * f; d.vy += ey / dist * f; }
      }
      // lò xo kéo về vị trí gốc
      d.vx += (d.hx - d.x) * 0.06; d.vy += (d.hy - d.y) * 0.06;
      d.vx *= 0.84; d.vy *= 0.84;
      d.x += d.vx; d.y += d.vy;

      const off = Math.min(1, Math.hypot(d.x - d.hx, d.y - d.hy) / (gap * 5));
      ctx.fillStyle = color(d, off);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r * (1 + off * 0.25), 0, Math.PI * 2); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  build();
  let t, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW && mobileMQ.matches) return; lastW = innerWidth; clearTimeout(t); t = setTimeout(build, 150); });
  requestAnimationFrame(frame);
})();
</script>
<script>
/* Rời trang mượt khi bấm Về portfolio / Về CV */
document.querySelectorAll('.nav-back a').forEach(a => a.addEventListener('click', e => {

  e.preventDefault();

addEventListener('pageshow', e => { if (e.persisted) document.body.classList.remove('leaving'); });

<script>
/* Cập nhật vị trí gradient cho từng nút theo con trỏ */
(function () {
  const bars = [...document.querySelectorAll('.bar')];
  const NEAR = 140; // khoảng cách (px) bắt đầu sáng
  let px = -9999, py = -9999, raf = 0;
  function update() {
    raf = 0;
    for (const b of bars) {
      const r = b.getBoundingClientRect();
      const dx = Math.max(r.left - px, 0, px - r.right);
      const dy = Math.max(r.top - py, 0, py - r.bottom);
      const o = Math.max(0, 1 - Math.hypot(dx, dy) / NEAR);
      b.style.setProperty('--mx', (px - r.left) + 'px');
      b.style.setProperty('--my', (py - r.top) + 'px');
      b.style.setProperty('--o', o.toFixed(3));
    }
  }
  addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
  document.addEventListener('pointerleave', () => { px = py = -9999; update(); });
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
})();
</script>
<script>
/* Particle drift: ký tự ASCII trôi chậm, nối nhau thành mạng lưới, kèm vệt sáng rơi dọc (tông đỏ) */
(function () {
  const canvas = document.getElementById('drift');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*()+=?';
  const pick = () => CHARS[Math.floor(Math.random() * CHARS.length)];
  let W, H, dpr, parts = [], rains = [];

  function makeRain(initial) {
    return { x: Math.random() * W, y: initial ? Math.random() * H : -Math.random() * H * 0.5,
             len: 50 + Math.random() * 110, v: 1.2 + Math.random() * 2.6, a: 0.25 + Math.random() * 0.45 };
  }
  function init() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(160, Math.max(45, (W * H) / 8500)));
    parts = Array.from({ length: n }, () => {
      const ang = Math.random() * Math.PI * 2, sp = 0.08 + Math.random() * 0.22;
      return { x: Math.random() * W, y: Math.random() * H, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
               c: pick(), a: 0.25 + Math.random() * 0.4, t: Math.random() * 400 };
    });
    rains = Array.from({ length: Math.round(W / 55) }, () => makeRain(true));
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    const LINK = Math.min(110, W * 0.12), LINK2 = LINK * LINK;

    // đường nối giữa các hạt gần nhau
    ctx.lineWidth = 0.6;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      for (let j = i + 1; j < parts.length; j++) {
        const q = parts[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
        if (d2 < LINK2) {
          ctx.strokeStyle = `rgba(239, 68, 68, ${(0.16 * (1 - d2 / LINK2)).toFixed(3)})`;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
      }
    }

    // ký tự
    ctx.font = '11px ui-monospace, "SF Mono", Menlo, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of parts) {
      if (!reduce) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
        if (--p.t < 0) { p.c = pick(); p.t = 200 + Math.random() * 400; }
      }
      ctx.fillStyle = `rgba(254, 202, 202, ${p.a.toFixed(2)})`;
      ctx.fillText(p.c, p.x, p.y);
    }

    // vệt sáng rơi
    ctx.lineWidth = 1.2;
    for (let i = 0; i < rains.length; i++) {
      const r = rains[i];
      if (!reduce) { r.y += r.v; if (r.y - r.len > H) rains[i] = makeRain(false); }
      const g = ctx.createLinearGradient(0, r.y - r.len, 0, r.y);
      g.addColorStop(0, 'rgba(239, 68, 68, 0)');
      g.addColorStop(1, `rgba(251, 146, 60, ${r.a.toFixed(2)})`);
      ctx.strokeStyle = g;
      ctx.beginPath(); ctx.moveTo(r.x, r.y - r.len); ctx.lineTo(r.x, r.y); ctx.stroke();
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  init();
  let t, lastW = innerWidth;
  addEventListener('resize', () => { if (innerWidth === lastW && Math.abs(innerHeight - H) < 120) return; lastW = innerWidth; clearTimeout(t); t = setTimeout(init, 150); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
